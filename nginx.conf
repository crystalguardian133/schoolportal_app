# Reverse proxy for production: TLS termination + same-domain routing.
#   /app/* -> Reverb (pusher protocol, incl. websocket upgrade)
#   /*     -> Laravel app
#Mirrors the proven local scripts/ngrok-proxy.mjs path split.
#
# Certs are issued on the HOST:
#   sudo certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN_HERE
# with /var/www/certbot shared into this container (see docker-compose.yml).
# Renew: certbot renew --deploy-hook "docker compose --env-file deploy.env exec proxy nginx -s reload"

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream laravel_app { server app:8080; }
upstream laravel_reverb { server app:8081; }

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

    # Announcement images validate at 4MB; allow headroom.
    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /app/ {
        proxy_pass http://laravel_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reverb pings every ~60s; never cut an idle socket early.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://laravel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
