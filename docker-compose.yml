# Production deployment (Docker on a VPS, single domain).
#
# Services:
#   app   - this repo's Dockerfile; entrypoint runs
#           `serve :8080` + `reverb :8081` + `queue:work` (when QUEUE!=sync)
#   proxy - nginx: TLS termination + same-domain routing:
#           /app/* -> Reverb :8081, everything else -> app :8080
#           (production twin of scripts/ngrok-proxy.mjs)
#
# Database: EXTERNAL. DB_* come from .env.prod verbatim (same key names as
# local .env); this file defines no db service and changes no DB variables.
# The entrypoint skips migrations on untracked-but-populated databases
# (STATUS=external) unless RUN_MIGRATIONS=always.
#
# Build args (Vite bakes VITE_* into the JS bundle at image build time, so a
# rebuild is required whenever they change):
#   docker compose --env-file deploy.env build
#   docker compose --env-file deploy.env up -d
services:
  app:
    build:
      context: .
      args:
        APP_KEY: ${APP_KEY:?set APP_KEY in deploy.env}
        VITE_APP_NAME: ${VITE_APP_NAME:-DNHS Portal}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY in deploy.env}
        VITE_REVERB_HOST: ${APP_DOMAIN:?set APP_DOMAIN in deploy.env}
        VITE_REVERB_PORT: 443
        VITE_REVERB_SCHEME: https
    env_file: .env.prod
    environment:
      APP_URL: https://${APP_DOMAIN:?set APP_DOMAIN in deploy.env}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8081
      REVERB_SCHEME: https
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
    volumes:
      # Uploads + file sessions/cache must survive redeploys.
      - app-storage:/var/www/html/storage
      - app-announcements:/var/www/html/resources/assets/announcements
      - app-profile-pics:/var/www/html/resources/assets/profile_pictures
      # Host certbot writes ACME challenges here (see nginx.conf).
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Written by certbot ON THE HOST (certonly --webroot). Never baked.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-storage:
  app-announcements:
  app-profile-pics:
  certbot-webroot:
